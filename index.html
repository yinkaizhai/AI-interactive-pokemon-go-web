<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Creature Catch - Unofficial Fan Demo</title>
    <meta name="description" content="An unofficial, non-commercial hand-tracking creature-catching web experiment.">
    
    <!-- External Libraries -->
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="src/css/style.css">
    
    <!-- Mobile Web App Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <!-- Map Page -->
    <div id="mapPage">
        <div id="map"></div>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search for location..." />
            <button id="searchBtn">Search</button>
        </div>
        <aside class="project-notice">
            Unofficial, non-commercial fan experiment. Animated sprites are loaded from
            <a href="https://www.pkparaiso.com/espada_escudo/sprites_pokemon.php?cid=14&amp;order=#sprites"
               target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">PkParaiso</a>.
            Pokemon and related marks belong to their respective owners. No affiliation or endorsement.
        </aside>
    </div>

    <!-- Capture Page -->
    <div id="capturePage">
        <div class="capture-controls">
            <button id="abandonBtn" class="abandon-button">Back to map</button>
            <button id="switchCameraBtn" class="switch-camera-button">Use rear camera</button>
        </div>
        <div class="tracking-hint">Close your fist, lift, then open to throw. On mobile, swipe up to throw.</div>
        <div class="game-background">
            <div class="battle-platform platform-left"></div>
            <div class="battle-platform platform-right"></div>
            <div class="divider-line"></div>
            <div class="center-pokeball">
                <div class="line-left"></div>
                <div class="line-right"></div>
                <div class="circle-outer"></div>
                <div class="circle-inner"></div>
            </div>
        </div>
        <div class="camera-preview" aria-label="Live camera preview">
            <video id="video" autoplay playsinline muted></video>
            <span class="camera-preview-label">Camera</span>
        </div>
        <canvas id="outputCanvas"></canvas>
        <canvas id="threeCanvas"></canvas>
        <img id="pokemon" src="" alt="Animated creature" referrerpolicy="no-referrer">
        <div id="absorbBeam">
            <div class="beam-inner"></div>
        </div>
    </div>

    <!-- Custom Scripts -->
    <!-- Load capture.js first as it contains functions needed by map.js -->
    <script src="src/js/capture.js"></script>
    <script src="src/js/animations.js"></script>
    <script src="src/js/map.js"></script>
    
    <script>
        // Initialize map page
        window.onload = async () => {
            await loadPokemonFiles();
            document.getElementById('mapPage').style.display = 'block';
            
            const initialPokemon = Math.min(MAX_POKEMON_IN_VIEW, 10);
            for(let i = 0; i < initialPokemon; i++) {
                setTimeout(() => addRandomGifInView(), i * 200);
            }
            
            setInterval(checkPokemonInView, 5000);

            // Add event listener for abandon button
            document.getElementById('abandonBtn').addEventListener('click', () => {
                if (typeof window.abandonCapture === 'function') {
                    window.abandonCapture();
                }
            });
            document.getElementById('switchCameraBtn').addEventListener('click', () => {
                if (typeof window.switchCaptureCamera === 'function') {
                    window.switchCaptureCamera();
                }
            });
        };

        // Handle window resize
        window.addEventListener('resize', () => {
            if (typeof renderer !== 'undefined' && renderer) {
                window.resizeCaptureScene();
            }
        });
    </script>
</body>
</html>
